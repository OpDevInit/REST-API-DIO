spring:
    application:
        name: rest-api-dio
    jpa:  
        database-platform: org.hibernate.dialect.H2Dialect  
        hibernate:
            ddl-auto: update
        show-sql: true
        properties:
            hibernate:
                format_sql: true
    h2:
        console:
            enabled: true        
    datasource:
        url: jdbc:h2:mem:testdb
        username: root
        password: root
        driver-class-name: org.h2.Driver
